name: Validate fixtures against schema.json

on:
  push:
    branches: [ main ]
    paths:
      - 'fixtures/**'
      - 'schema.json'
      - 'VERSION'
      - 'scripts/validate.py'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'fixtures/**'
      - 'schema.json'
      - 'VERSION'
      - 'scripts/validate.py'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate JSON Schema (Draft 2020-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install --upgrade pip jsonschema

      - name: Validate fixtures & VERSION
        run: python scripts/validate.py
